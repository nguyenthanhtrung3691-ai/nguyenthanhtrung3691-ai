<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Nguyen Thanh Trung - Hotel Consultant, OTA, Data Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="48" y="120" width="0" height="40">
        <animate attributeName="width" values="0;470;470;0" keyTimes="0;0.35;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .name{animation:slide 1.2s ease-out both}
    .bar{transform-origin:left center;animation:grow 1.2s .5s ease-out both}
    .twinkle{animation:tw 3s ease-in-out infinite}
    @keyframes slide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  </style>
  <rect width="900" height="260" rx="16" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle class="twinkle" cx="120" cy="30" r="1.6"/>
    <circle class="twinkle" cx="300" cy="22" r="1.2" style="animation-delay:.8s"/>
    <circle class="twinkle" cx="520" cy="40" r="1.8" style="animation-delay:1.5s"/>
    <circle class="twinkle" cx="700" cy="25" r="1.3" style="animation-delay:.4s"/>
    <circle class="twinkle" cx="840" cy="48" r="1.6" style="animation-delay:2.1s"/>
    <circle class="twinkle" cx="610" cy="235" r="1.3" style="animation-delay:1.1s"/>
  </g>

  <!-- flight route + plane -->
  <path id="route" d="M40 225 Q 250 160 430 205 T 860 130" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="3 8">
    <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <circle cx="40" cy="225" r="5" fill="#2dd4bf"/>
  <circle cx="860" cy="130" r="5" fill="#60a5fa"/>
  <g>
    <path d="M-12 0 L10 -6 L4 0 L10 6 Z" fill="#ffffff"/>
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
  </g>

  <!-- animated bar chart -->
  <g transform="translate(660 40)" fill="url(#accent)">
    <rect x="0" y="70" width="26" height="50" rx="4"><animate attributeName="height" values="30;70;30" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="90;50;90" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="38" y="40" width="26" height="80" rx="4"><animate attributeName="height" values="60;95;60" dur="3.4s" repeatCount="indefinite"/><animate attributeName="y" values="60;25;60" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="76" y="55" width="26" height="65" rx="4"><animate attributeName="height" values="45;85;45" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="75;35;75" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="114" y="15" width="26" height="105" rx="4"><animate attributeName="height" values="80;110;80" dur="3.8s" repeatCount="indefinite"/><animate attributeName="y" values="40;10;40" dur="3.8s" repeatCount="indefinite"/></rect>
    <line x1="-10" y1="121" x2="150" y2="121" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  </g>

  <text class="t name" x="48" y="88" font-size="44" font-weight="700" fill="#ffffff">Nguyễn Thành Trung</text>
  <rect class="bar" x="48" y="102" width="140" height="4" rx="2" fill="url(#accent)"/>

  <!-- typing subtitle -->
  <g clip-path="url(#typeClip)">
    <text class="t" x="48" y="147" font-size="21" fill="#e2e8f0">Online Travel Agent | Finance | Data Analyst</text>
  </g>

  <!-- rotating taglines -->
  <g class="t" font-size="16" fill="#94a3b8">
    <text x="48" y="195">Turning hotel &amp; OTA data into decisions
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.33;0.6;0.66;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="195" opacity="0">Automating repetitive hotel operations with Python
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.6;0.66;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="195" opacity="0">Building dashboards in Power BI &amp; SQL
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>
  <text class="t" x="48" y="235" font-size="14" fill="#64748b">📍 Ho Chi Minh City, Vietnam</text>
</svg>
