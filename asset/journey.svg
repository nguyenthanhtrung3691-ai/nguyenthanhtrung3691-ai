<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Career journey 2020 to 2025">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;text-anchor:middle}
    .draw{stroke-dasharray:780;stroke-dashoffset:780;animation:draw 3.2s ease-out forwards}
    .item{opacity:0;animation:pop .7s ease-out forwards}
    .dot{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}
  </style>
  <rect width="900" height="290" rx="16" fill="#0f172a"/>
  <text x="40" y="45" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">My Journey</text>

  <line class="draw" x1="70" y1="145" x2="830" y2="145" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

  <g class="item" style="animation-delay:.2s">
    <circle cx="130" cy="145" r="9" fill="#2dd4bf"/>
    <text class="t" x="130" y="120" font-size="15" font-weight="700" fill="#2dd4bf">2020</text>
    <text class="t" x="130" y="180" font-size="14" font-weight="600" fill="#e2e8f0">Business Dev</text>
    <text class="t" x="130" y="199" font-size="13" fill="#94a3b8">Hobien</text>
  </g>
  <g class="item" style="animation-delay:.8s">
    <circle cx="290" cy="145" r="9" fill="#2dd4bf"/>
    <text class="t" x="290" y="120" font-size="15" font-weight="700" fill="#2dd4bf">2021</text>
    <text class="t" x="290" y="180" font-size="14" font-weight="600" fill="#e2e8f0">Business Dev Exec</text>
    <text class="t" x="290" y="199" font-size="13" fill="#94a3b8">Aharooms</text>
  </g>
  <g class="item" style="animation-delay:1.4s">
    <circle cx="450" cy="145" r="9" fill="#38bdf8"/>
    <text class="t" x="450" y="120" font-size="15" font-weight="700" fill="#38bdf8">2023</text>
    <text class="t" x="450" y="180" font-size="14" font-weight="600" fill="#e2e8f0">E-commerce Sales</text>
    <text class="t" x="450" y="199" font-size="13" fill="#94a3b8">Aharooms (OTA)</text>
  </g>
  <g class="item" style="animation-delay:2s">
    <circle cx="610" cy="145" r="9" fill="#38bdf8"/>
    <text class="t" x="610" y="120" font-size="15" font-weight="700" fill="#38bdf8">2024</text>
    <text class="t" x="610" y="180" font-size="14" font-weight="600" fill="#e2e8f0">Reservations &amp; OTA</text>
    <text class="t" x="610" y="199" font-size="13" fill="#94a3b8">An Corner</text>
  </g>
  <g class="item" style="animation-delay:2.6s">
    <circle class="dot" cx="770" cy="145" r="8" fill="#60a5fa"/>
    <text class="t" x="770" y="120" font-size="15" font-weight="700" fill="#60a5fa">2025</text>
    <text class="t" x="770" y="180" font-size="14" font-weight="600" fill="#e2e8f0">Hotel Consultant</text>
    <text class="t" x="770" y="199" font-size="13" fill="#94a3b8">Blue Sky Travel</text>
  </g>

  <text class="t item" style="animation-delay:3.2s" x="450" y="260" font-size="14" fill="#94a3b8">Sales → OTA → Consulting → Data</text>
</svg>
